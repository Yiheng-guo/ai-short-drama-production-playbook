<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="520" viewBox="0 0 1440 520" role="img" aria-label="短剧镜头生产与验收流水线">
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1424"/><stop offset="1" stop-color="#142b3a"/></linearGradient>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#80a6bd"/></marker>
  <style>text{font-family:-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC','Microsoft YaHei',sans-serif}.title{font-size:33px;font-weight:700;fill:#f8fafc}.sub{font-size:18px;fill:#a8c1cf}.label{font-size:25px;font-weight:700;fill:#f8fafc}.body{font-size:17px;fill:#c4d4dc}.small{font-size:16px;fill:#a8c1cf}.line{fill:none;stroke:#80a6bd;stroke-width:4;marker-end:url(#arrow)}</style>
</defs>
<rect width="1440" height="520" rx="26" fill="url(#bg)"/>
<text x="55" y="62" class="title">从候选镜头到可交付短剧</text>
<text x="55" y="96" class="sub">每一步留下可回退的版本；声音、口型、人物与剧情一起验收</text>
<g>
<rect x="55" y="145" width="240" height="175" rx="18" fill="#1e3b53" stroke="#4281a1" stroke-width="2"/>
<text x="80" y="192" class="label">01 剧本合同</text><text x="80" y="229" class="body">人物目标 · 准确台词</text><text x="80" y="258" class="body">道具状态 · 集尾钩子</text><text x="80" y="287" class="small">输出：逐镜卡</text>
<path d="M302 232 H332" class="line"/>
<rect x="340" y="145" width="240" height="175" rx="18" fill="#21463f" stroke="#63b48f" stroke-width="2"/>
<text x="365" y="192" class="label">02 生成候选</text><text x="365" y="229" class="body">参考图真实绑定</text><text x="365" y="258" class="body">原片版本不覆盖</text><text x="365" y="287" class="small">输出：可追溯素材</text>
<path d="M587 232 H617" class="line"/>
<rect x="625" y="145" width="240" height="175" rx="18" fill="#3d344e" stroke="#ac8ac8" stroke-width="2"/>
<text x="650" y="192" class="label">03 清单式剪辑</text><text x="650" y="229" class="body">源秒段 · 声源模式</text><text x="650" y="258" class="body">JSON + FFmpeg</text><text x="650" y="287" class="small">输出：工作版 MP4</text>
<path d="M872 232 H902" class="line"/>
<rect x="910" y="145" width="240" height="175" rx="18" fill="#51402e" stroke="#e0aa61" stroke-width="2"/>
<text x="935" y="192" class="label">04 双层质检</text><text x="935" y="229" class="body">机器：解码/时长/黑帧</text><text x="935" y="258" class="body">人工：人/声/口/剧情</text><text x="935" y="287" class="small">输出：逐项验收结果</text>
<path d="M1157 232 H1187" class="line"/>
<rect x="1195" y="145" width="190" height="175" rx="18" fill="#204a59" stroke="#60bed0" stroke-width="2"/>
<text x="1220" y="192" class="label">05 锁版</text><text x="1220" y="229" class="body">六集连看</text><text x="1220" y="258" class="body">分发端复核</text><text x="1220" y="287" class="small">输出：成片</text>
</g>
<path d="M1030 326 V394 H461 V327" fill="none" stroke="#edb66d" stroke-width="3" stroke-dasharray="9 8" marker-end="url(#arrow)"/>
<rect x="655" y="374" width="256" height="41" rx="20" fill="#5a422c"/><text x="682" y="402" class="body" fill="#fff">不通过：定位镜头并返工</text>
<text x="55" y="470" class="small">关键判断：合格镜头率与观众理解度，比“生成了多少条”更能解释成本和质量。</text>
</svg>
